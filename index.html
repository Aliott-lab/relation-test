<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاخص وضعیت رابطه | کلینیک سپهر آرامش</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --card-bg: #161f30;
      --card-border: #24324a;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
    }

    * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 24px 12px; line-height: 1.7; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 35px 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--card-border); }

    .clinic-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 5px; }
    .clinic-brand { color: var(--primary); font-size: 1.2rem; font-weight: 600; letter-spacing: 0.5px; }
    .clinic-logo-header { width: 38px; height: 38px; object-fit: contain; }
    .clinic-logo-footer { width: 50px; height: 50px; object-fit: contain; margin-top: 15px; }

    h1 { text-align: center; color: #ffffff; margin-top: 0; margin-bottom: 25px; font-size: 1.7rem; }
    h2 { text-align: center; color: #ffffff; margin-bottom: 20px; font-size: 1.5rem; }

    .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 30px; padding: 20px; background: rgba(15, 23, 42, 0.6); border-radius: 12px; border: 1px solid var(--card-border); }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); }
    .form-group input, .form-group select { padding: 9px 12px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; font-size: 0.95rem; color: #ffffff; outline: none; transition: 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

    .questions-wrapper { display: flex; flex-direction: column; gap: 12px; }
    .question-row { padding: 14px 16px; border-radius: 10px; background: rgba(15, 23, 42, 0.45); border: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 10px; transition: 0.2s; }
    .question-row:hover { border-color: #334155; background: rgba(15, 23, 42, 0.7); }
    .question-title { font-size: 0.97rem; font-weight: 500; color: #e2e8f0; }

    .options { display: flex; flex-wrap: wrap; gap: 12px; }
    .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem; color: var(--text-muted); background: var(--input-bg); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--card-border); transition: 0.2s; }
    .options label:hover { color: #ffffff; border-color: var(--primary); }
    .options input[type="radio"] { accent-color: var(--primary); width: 16px; height: 16px; }

    button.submit-btn { display: block; width: 100%; max-width: 320px; margin: 35px auto 10px auto; padding: 14px 20px; background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); }
    button.submit-btn:hover { background: linear-gradient(135deg, #0369a1, #0284c7); transform: translateY(-1px); }
    button.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    #result-view { display: none; }
    
    .chart-box-card { background: rgba(15, 23, 42, 0.7); border: 1px solid var(--card-border); border-radius: 14px; padding: 22px; margin-bottom: 30px; }
    .chart-box-card h3 { margin: 0 0 16px 0; color: var(--primary); font-size: 1.2rem; text-align: center; }

    .clinical-interpretations-container { display: flex; flex-direction: column; gap: 14px; margin-top: 25px; }
    .interpretation-item { background: rgba(15, 23, 42, 0.55); border-right: 4px solid var(--primary); border-radius: 8px; padding: 12px 16px; }
    .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .item-title { font-weight: bold; font-size: 0.98rem; color: #f8fafc; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; color: #000000; }
    .item-desc { font-size: 0.88rem; color: #cbd5e1; margin: 0; line-height: 1.6; }

    .clinic-footer { margin-top: 40px; padding: 25px 20px; background: rgba(15, 23, 42, 0.7); border-radius: 12px; border: 1px solid var(--card-border); text-align: center; }
    .clinic-footer h3 { color: var(--primary); margin: 0 0 12px 0; font-size: 1.15rem; }
    .clinic-footer p { margin: 6px 0; color: #cbd5e1; font-size: 0.95rem; }
    .clinic-footer a { color: var(--primary); text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div id="survey-view">
    <div class="clinic-header">
      <span class="clinic-brand">کلینیک سپهر آرامش</span>

    </div>
    <h1>شاخص وضعیت رابطه</h1>

      <div class="profile-grid">
        <div class="form-group"><label>نام و نام خانوادگی:</label><input type="text" id="p_name" required></div>

        <div class="form-group"><label>تحصیلات:</label><input type="text" id="p_edu" required></div>
        <div class="form-group"><label>شماره تماس:</label><input type="tel" id="p_phone" required></div>
        <div class="form-group">
          <label>وضعیت تأهل:</label>
          <select id="p_married" required>
            <option value="ازدواج کرده‌ام">ازدواج کرده‌ام</option>
            <option value="ازدواج نکرده‌ام">ازدواج نکرده‌ام</option>
          </select>
        </div>
        <div class="form-group" id="fg_m_year"><label>سال ازدواج:</label><input type="text" id="p_m_year" required></div>
        <div class="form-group" id="fg_children"><label>تعداد فرزند:</label><input type="number" id="p_children" required></div>
        <div class="form-group" id="fg_dating" style="display: none;"><label>مدت آشنایی:</label><input type="text" id="p_dating"></div>
      </div>

      <div class="questions-wrapper" id="questions-container"></div>
      <button type="submit" id="submit-btn" class="submit-btn">ثبت پاسخ‌ها و مشاهده نمودار</button>
    </form>
  </div>

  <div id="result-view">
    <div class="clinic-header">
      <span class="clinic-brand">کلینیک سپهر آرامش</span>

    <h2>گزارش جامع وضعیت رابطه</h2>

    <div class="chart-box-card">

      <div style="position: relative; height: 350px;">
        <canvas id="main_comparison_chart"></canvas>
      </div>
    </div>

    <h3 style="color: #e2e8f0; margin-top: 30px; font-size: 1.15rem;">ارزیابی و توصیف بالینی نتایج</h3>
    <div class="clinical-interpretations-container" id="interpretations-wrapper"></div>

    <div class="clinic-footer">
      <h3>ارتباط با کلینیک سپهر آرامش</h3>
      <p><strong>آدرس:</strong> نبش احمد آباد ۷ - ساختمان گوهرشاد - طبقه سوم - واحد ۳۰۹</p>

        <img src="https://cdn.imgurl.ir/uploads/l39464_et_1s.png" alt="لوگو کلینیک" class="clinic-logo-footer">
      </div>
    </div>
  </div>
</div>

  "در بحث‌ها، فقط به نیازهای خود توجه می‌کنیم و به دغدغه‌ها و نیازهای طرف مقابل بی‌توجه هستیم.",
  "برای حل مشکلات و جلوگیری از تکرار آن، با هم صحبت نمی‌کنیم و مشکل را مسکوت می‌گذاریم.",
  "اگر در حل یک مسئله به بن‌بست برسیم، از کمک گرفتن از مشاور یا فرد سوم آگاه و بی‌طرف امتناع می‌کنیم.",
  "راه حل هایی که برای حل مسائل پیشنهاد میدهیم معمولا مورد پسند طرف مقابل نیست."
];

const container = document.getElementById("questions-container");

questions.forEach((qText, index) => {
  const qNum = index + 1;
  const qDiv = document.createElement("div");
  qDiv.className = "question-row";
  qDiv.innerHTML = `
    <div class="question-title"><strong>${qNum}.</strong> ${qText}</div>
    <div class="options">
      <label><input type="radio" name="q_${qNum}" value="me" required> فقط من</label>
      <label><input type="radio" name="q_${qNum}" value="spouse"> فقط همسرم</label>
      <label><input type="radio" name="q_${qNum}" value="both"> هر دو</label>
      <label><input type="radio" name="q_${qNum}" value="none"> هیچ‌کدام</label>
    </div>
  `;
  container.appendChild(qDiv);
});

// ضرایب جدید
function getScore(qIndex, answer) {
  const isRepair = (qIndex >= 29 && qIndex <= 35);
  if (isRepair) {
    if (answer === "both") return 1.5;
    if (answer === "me" || answer === "spouse") return 1.2;
    return 0.0;
  } else {
    if (answer === "both") return 1.2;
    if (answer === "me" || answer === "spouse") return 1.0;
    return 0.0;
  }
}

function getColorInfo(percentage, isDestructive = true) {
  if (isDestructive) {
    if (percentage <= 25) return { color: "#22c55e", label: "سالم و مطلوب" };
    if (percentage <= 50) return { color: "#facc15", label: "متوسط" };
    if (percentage <= 75) return { color: "#fb923c", label: "شدید" };
    return { color: "#f87171", label: "بحرانی" };
  } else {
    if (percentage >= 76) return { color: "#22c55e", label: "بسیار مطلوب و عالی" };
    if (percentage >= 51) return { color: "#facc15", label: "خوب و قابل قبول" };
    if (percentage >= 26) return { color: "#fb923c", label: "ضعیف" };
    return { color: "#f87171", label: "بسیار ضعیف" };
  }
}

// تولید توصیف بالینی کوتاه متناسب با درصد نمره
function getClinicalInterpretation(type, percent) {
  if (type === "عيب‌جويی") {
    if (percent <= 25) return "گفتگوها با کمترین حمله به شخصیت همراه بوده و تمرکز زوجین بر حل رفتار مشخص است.";
    if (percent <= 50) return "گاهی شکایت‌ها به سمت کلی‌گویی و سرزنش متمایل می‌شود که نیازمند دقت در انتخاب کلمات است.";
    if (percent <= 75) return "عیب‌جویی و برچسب‌زنی مکرر مانع از شنیده شدن اصل نیازهای عاطفی طرفین شده است.";
    return "حملات شدید شخصیتی در تعارضات حاکم است که احساس بی‌ارزشی عمیقی در طرف مقابل ایجاد می‌کند.";
  }
  if (type === "خوار کردن") {
    if (percent <= 25) return "احترام متقابل و شأن فردی طرفین در هنگام تنش‌ها به خوبی حفظ می‌شود.";
    if (percent <= 50) return "گاهی لحن طعنه‌آمیز یا قضاوت برتر دیده می‌شود که در صورت مهارنشدن فرسایش عاطفی می‌آورد.";
    if (percent <= 75) return "استفاده از کنایه، تمسخر و زبان بدن تحقیرآمیز، امنیت روانی رابطه را خدشه‌دار کرده است.";
    return "رفتارهای تحقیرآمیز و القای حس کهتری در سطح خطرناکی فعال بوده و مخرب‌ترین عامل تخریب رابطه است.";
  }
  if (type === "مقابله") {
    if (percent <= 25) return "پذیرش سهم فردی در اشتباهات بالاست و حالت تدافعی اندکی در تعارضات مشاهده می‌شود.";
    if (percent <= 50) return "توجیه خطاها و بهانه‌تراشی گاهی مانع از درک کامل دیدگاه همسر در مشاجرات می‌شود.";
    if (percent <= 75) return "حالت تدافعی مزمن و انتقال مداوم تقصیر به دیگری مانع از به نتیجه رسیدن گفتگوها شده است.";
    return "انکار شدید مسئولیت فردی و مقصردانستن مطلق طرف مقابل، فضا را به بن‌بست دفاعی کشانده است.";
  }
  if (type === "دوری") {
    if (percent <= 25) return "حفظ ارتباط چشمی و حضور هیجانی در طول بحث‌ها مطلوب بوده و از سکوت قهرآمیز پرهیز می‌شود.";
    if (percent <= 50) return "گاهی در اوج تنش عقب‌نشینی هیجانی رخ می‌دهد که نیازمند بازگشت ایمن به گفتگو است.";
    if (percent <= 75) return "دیوارکشی، ترک مکرر موقعیت و بی‌اعتنایی طولانی‌مدت به عنوان واکنش دفاعی به کار گرفته می‌شود.";
    return "انقطاع عاطفی شدید و سکوت انسدادی رابطه را در حالت فلج ارتباطی قرار داده است.";
  }
  if (type === "آغاز طوفانی") {
    if (percent <= 25) return "ورود به گفتگوها نرم، آرام و بدون تحریک تهاجمی صورت می‌پذیرد.";
    if (percent <= 50) return "شروع مباحث گاهی با لحن تند همراه است که پتانسیل شعله‌ور ساختن زودهنگام تنش را دارد.";
    if (percent <= 75) return "اغلب گفتگوها با اتهام و کلمات منفی آغاز شده که مسیر حل مسئله را از همان ابتدا منحرف می‌سازد.";
    return "گفتگوها به صورت مداوم با تندی شدید و پرخاش آغاز شده و پیش از شکل‌گیری تبادل نظر ناکام می‌ماند.";
  }
  if (type === "فوران هیجان") {
    if (percent <= 25) return "کنترل خشم و خودآرام‌سازی هیجانی در هنگام بحران‌ها در سطح بسیار رضایت‌بخشی قرار دارد.";
    if (percent <= 50) return "در مشاجرات شدید غلبه هیجان رخ می‌دهد اما امکان بازیابی آرامش هنوز وجود دارد.";
    if (percent <= 75) return "برانگیختگی فیزیولوژیک بالا و رفتارهای تکانشی تفکر منطقی را در زمان تنش کاملاً مختل می‌کند.";
    return "طغیان شدید و سریع خشم مانع از هرگونه مهار رفتار شده و رابطه را متشنج می‌سازد.";
  }
  if (type === "سردی") {
    if (percent <= 25) return "محبت، ابراز صمیمیت کلامی و پیوند عاطفی گرم میان زوجین به قوت جریان دارد.";
    if (percent <= 50) return "کاهش مقطعی کلمات محبت‌آمیز نشانه‌ای از نیاز به تجدید صمیمیت و وقت‌گذرانی مشترک است.";
    if (percent <= 75) return "دلسردی و احساس تنهایی چشمگیری در رابطه تجربه شده و فاصله عاطفی رو به افزایش است.";
    return "بی‌تفاوتی و ناامیدی عمیق نسبت به آینده، گرمای رابطه را به سمت انجماد عاطفی برده است.";
  }
  if (type === "بی‌اعتمادی") {
    if (percent <= 25) return "امنیت روانی بالا، صداقت در مراودات و وفاداری عمیق متقابل میان زوجین حاکم است.";
    if (percent <= 50) return "تردیدها یا حساسیت‌هایی در خصوص حدومرزها وجود دارد که نیازمند شفاف‌سازی متقابل است.";
    if (percent <= 75) return "شک، عدم اطمینان به تعهدات و پنهان‌کاری، پایه‌های اعتماد طرفین را تضعیف نموده است.";
    return "بحران جدی در وفاداری و ناامنی شدید روانی مانع از شکل‌گیری پیوند امن در رابطه است.";
  }
  if (type === "نارضایی جنسی") {
    if (percent <= 25) return "صمیمیت فیزیکی، نوازش و رضایت کلی از کیفیت رابطه جنسی در سطح بسیار سالمی قرار دارد.";
    if (percent <= 50) return "گفتگو درباره ترجیحات جنسی و بازنگری در دفعات نزدیکی می‌تواند سطح رضایت را بهبود بخشد.";
    if (percent <= 75) return "ناکامی، عدم تطابق میل جنسی و کاهش محسوس تماس بدنی ایجاد فاصله کرده است.";
    return "اجتناب کامل، رد تمایلات و عدم رضایت حاد جنسی، فشار روانی شدیدی بر تعهد زناشویی وارد کرده است.";
  }
  if (type === "ناتوانی در حل تعارض") {
    if (percent <= 25) return "مهارت‌های همفکری، گوش دادن فعال و دستیابی به مصالحه در بالاترین کارآمدی قرار دارد.";
    if (percent <= 50) return "حل تعارضات نیازمند زمان و هدایت ساختاریافته‌تری است تا منجر به تکرار مشکلات نشود.";
    if (percent <= 75) return "مشکلات حل‌نشده انباشته شده و گفتگوها به جای ارائه راه‌حل مشترک به تنش افزون‌تر می‌انجامد.";
    return "ناتوانی ساختاری در دستیابی به توافق و اجتناب از مداخله تخصصی، بحران‌ها را مزمن کرده است.";
  }
  if (type === "تلاش‌های ترمیمی") {
    if (percent >= 76) return "قابلیت عالی در شوخ‌طبعی مثبت، عذرخواهی به‌موقع و خنثی‌سازی تنش‌های روزمره فعال است.";
    if (percent >= 51) return "اقدامات ترمیمی تا حدی اثربخش است ولی نیازمند تقویت در نحوه شنیدن پیام‌های عذرخواهی است.";
    if (percent >= 26) return "تلاش‌های آشتی‌جویانه به ندرت آغاز شده یا از سوی طرف مقابل پس زده می‌شود.";
    return "فقدان سازوکارهای مصالحه و پذیرش خطا، اثر محافظت‌کننده رابطه را تقریباً خنثی کرده است.";
  }
  if (type === "وضعیت کلی بدون تلاش‌های ترمیمی") {
    if (percent <= 25) return "پایه آسیب‌های تعاملی بسیار پایین بوده و ساختار عمومی تعاملات در بستری ایمن جریان دارد.";
    if (percent <= 50) return "فرسایش تعاملی در سطح میانه است که با هوشیاری زوجین قابل کنترل و تعدیل خواهد بود.";
    if (percent <= 75) return "مجموعه آسیب‌های تعاملی وزن سنگینی پیدا کرده و فشار قابل توجهی بر ثبات رابطه می‌آورد.";
    return "بار تخریبی مولفه‌ها بدون حضور عوامل کاهنده، رابطه را در آستانه فرسودگی حاد قرار داده است.";
  }
  if (type === "وضعیت کلی با تلاش‌های ترمیمی") {
    if (percent <= 25) return "تلاش‌های ترمیمی تنش‌های موجود را مهار کرده و تعادل و سلامت نهایی رابطه را تضمین نموده است.";
    if (percent <= 50) return "مهارت‌های ترمیمی تا حدودی اثر مخرب تعارضات را کاهش داده‌اند اما نیازمند مراقبت مداوم است.";
    if (percent <= 75) return "با وجود برخی اقدامات بازدارنده، آسیب‌ها فراتر از توان ترمیمی موجود بوده و مداخله بالینی توصیه می‌شود.";
    return "آسیب کلی بالا همراه با ناکامی در ترمیم، رابطه را در وضعیت قرمز و نیازمند مشاوره تخصصی فوری قرار داده است.";
  }
  return "";
}

document.getElementById("quiz-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const submitBtn = document.getElementById("submit-btn");
  submitBtn.disabled = true;
  submitBtn.innerText = "در حال پردازش داده‌ها...";

  const formData = new FormData(e.target);
  let destructiveSum = 0;
  let scoresMap = {};

  // محاسبه ۱۰ بعد مخرب
  const destructiveResults = destructiveSubscales.map(scale => {
    let totalScore = 0;
    for (let q = scale.range[0]; q <= scale.range[1]; q++) {
      const ans = formData.get(`q_${q}`);
      totalScore += getScore(q, ans);
    }
    const percent = Math.min(100, Math.round((totalScore / scale.maxRaw) * 100));
    scoresMap[scale.title] = percent;
    destructiveSum += percent;
    return {
      id: scale.id,
      title: scale.title,
      percent: percent,
      colorInfo: getColorInfo(percent, true)
    };
  });

  // محاسبه بعد یازدهم: تلاش‌های ترمیمی
  let repairScore = 0;
  for (let q = repairSubscale.range[0]; q <= repairSubscale.range[1]; q++) {
    const ans = formData.get(`q_${q}`);
    repairScore += getScore(q, ans);
  }
  const repairPercent = Math.min(100, Math.round((repairScore / repairSubscale.maxRaw) * 100));
  scoresMap[repairSubscale.title] = repairPercent;
  const repairResult = {
    id: 11,
    title: repairSubscale.title,
    percent: repairPercent,
    colorInfo: getColorInfo(repairPercent, false)
  };

  // ستون دوازدهم: وضعیت کلی بدون تلاش‌های ترمیمی
  const overallWithoutRepair = Math.round(destructiveSum / 10);
  const withoutRepairColor = getColorInfo(overallWithoutRepair, true);

  // ستون سیزدهم: وضعیت کلی با تلاش‌های ترمیمی
  const overallWithRepair = Math.max(0, Math.min(100, Math.round(overallWithoutRepair * (1 - (repairPercent / 200)))));
  const withRepairColor = getColorInfo(overallWithRepair, true);

  // فهرست کامل ۱۳ آیتم برای تحلیل و رسم
  const all13Results = [
    ...destructiveResults,
    repairResult,
    { id: 12, title: "وضعیت کلی بدون تلاش‌های ترمیمی", percent: overallWithoutRepair, colorInfo: withoutRepairColor },
    { id: 13, title: "وضعیت کلی با تلاش‌های ترمیمی", percent: overallWithRepair, colorInfo: withRepairColor }
  ];

  // ارسال داده‌ها به شیت
  const payload = {
    name: document.getElementById("p_name").value,
    age: document.getElementById("p_age").value,
    edu: document.getElementById("p_edu").value,
    phone: document.getElementById("p_phone").value,
    married: document.getElementById("p_married").value,
    m_year: document.getElementById("p_m_year").value,
    children: document.getElementById("p_children").value,
    dating: document.getElementById("p_dating").value,
    overallWithoutRepair: overallWithoutRepair,
    overallWithRepair: overallWithRepair,
    scores: scoresMap
  };

  if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_GOOGLE")) {
    try {
      fetch(GOOGLE_SHEET_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    } catch (err) {
      console.error("خطا در ارسال داده به شیت:", err);
    }
  }

  // تغییر صفحه
  document.getElementById("survey-view").style.display = "none";
  const resultView = document.getElementById("result-view");
  resultView.style.display = "block";
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // رسم نمودار ستونی با برچسب‌های ۱ تا ۱۳
  const labels1To13 = all13Results.map(r => r.id.toString());
  const dataPoints = all13Results.map(r => r.percent);
  const bgColors = all13Results.map(r => r.colorInfo.color);

  const compCtx = document.getElementById("main_comparison_chart").getContext("2d");
  new Chart(compCtx, {
    type: "bar",
    data: {
      labels: labels1To13,
      datasets: [{
        label: "درصد",
        data: dataPoints,
        backgroundColor: bgColors,
        borderRadius: 6,
        barPercentage: 0.72
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: (items) => `ستون ${items[0].label}`,
            label: (context) => `نمره: ${context.raw}٪`
          }
        }
      },
      scales: {
        y: {
          min: 0,
          max: 100,
          ticks: { color: "#94a3b8", stepSize: 25, callback: (v) => v + "%" },
          grid: { color: "#1e293b" }
        },
        x: {
          ticks: { color: "#f8fafc", font: { size: 13, weight: "bold" } },
          grid: { display: false }
        }
      }
    }
  });

  // نگارش توصیف بالینی ۱ تا ۱.۵ خطی زیر جدول برای تمام ۱۳ مورد
  const interpWrapper = document.getElementById("interpretations-wrapper");
  interpWrapper.innerHTML = "";

  all13Results.forEach(item => {
    const descText = getClinicalInterpretation(item.title, item.percent);
    const box = document.createElement("div");
    box.className = "interpretation-item";
    box.style.borderRightColor = item.colorInfo.color;
    box.innerHTML = `
      <div class="item-header">
        <span class="item-title">مؤلفه شماره ${item.id}: ${item.title}</span>
        <div>
          <span style="font-weight: bold; margin-left: 8px; color: #ffffff;">${item.percent}٪</span>
          <span class="badge" style="background-color: ${item.colorInfo.color};">${item.colorInfo.label}</span>
        </div>
      </div>
      <p class="item-desc">${descText}</p>
    `;
    interpWrapper.appendChild(box);
  });
});
</script>
